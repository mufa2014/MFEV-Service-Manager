<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MF.EV Service Manager</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @page { size: 58mm auto; margin: 0; }
        @media print {
            body * { visibility: hidden; }
            #areaCetak, #areaCetak * { visibility: visible; position: relative; }
            #areaCetak { width: 58mm !important; margin: 0 auto; padding: 0; }
            .no-print { display: none !important; }
        }

        /* Struk Thermal 58mm */
        .struk { 
            width: 58mm !important; 
            max-width: 58mm !important; 
            box-sizing: border-box; 
            font-family: 'Courier New', Courier, monospace; 
            font-size: 10px; 
            line-height: 1.3; 
            background: white; 
            padding: 8px 4px; 
            overflow: hidden; 
            margin: 0 auto;
            color: #000;
        }
        .judul-toko { font-size: 15px; font-weight: 900; text-align: center; margin-bottom: 2px; letter-spacing: 0.5px; }
        .sub-judul { font-size: 9px; text-align: center; margin-bottom: 6px; }
        .garis { border-bottom: 1px dashed #000; margin: 5px 0; }
        .kanan { text-align: right; }
        .tengah { text-align: center; }
        .tebal { font-weight: bold; }
        
        /* Baris Struk Utama */
        .baris { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start;
            margin: 3px 0; 
            gap: 6px; 
            word-break: break-word; 
        }
        
        /* Kolom Nama Pekerjaan vs Harga (Harga Terkunci Tidak Akan Terpotong / Turun Baris) */
        .item-nama {
            flex: 1;
            padding-right: 4px;
            word-wrap: break-word;
        }
        .item-harga {
            flex-shrink: 0; /* Menjamin harga tidak akan pernah terpotong / berpindah baris */
            white-space: nowrap;
            text-align: right;
            font-weight: bold;
        }

        .baris-struk { display: flex; margin: 2px 0; }
        .label-struk { width: 80px; flex-shrink: 0; }
        .nilai-struk { flex: 1; padding-left: 2px; word-break: break-word; }

        .btn-sortir { font-size: 11px; padding: 2px 6px; border-radius: 4px; border: 1px solid #ccc; background: #f9f9f9; cursor: pointer; transition: all 0.2s; }
        .btn-sortir.aktif { background: #166534; color: white; border-color: #166534; }
        .input-biaya { text-align: right; font-variant-numeric: tabular-nums; }
        
        /* Modal Struk */
        #modalStruk { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 9999; overflow-y: auto; padding: 20px 10px; }
        .isi-modal { background: white; max-width: 360px; margin: 0 auto; padding: 15px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .input-kerja { flex: 2; }
        .info-sinkron { font-size: 12px; color: #166534; background: #dcfce7; padding: 6px 12px; border-radius: 4px; margin-bottom: 12px; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans p-2 sm:p-4">

    <div class="max-w-4xl mx-auto space-y-4 no-print">
        
        <!-- Header Aplikasi -->
        <div class="bg-white rounded-lg shadow p-4 border-l-4 border-emerald-600 flex justify-between items-center flex-wrap gap-2">
            <div>
                <h1 class="text-xl sm:text-2xl font-bold text-gray-800">MF.EV Service Manager</h1>
                <p class="text-xs sm:text-sm text-gray-500">Sistem Manajemen Servis Kendaraan Listrik (Pangkalpinang)</p>
            </div>
            <div id="statusProses" class="text-xs text-gray-500 font-medium bg-gray-100 px-3 py-1 rounded-full border">
                Siap
            </div>
        </div>

        <!-- Form Input Servis Baru -->
        <div class="bg-white rounded-lg shadow p-4">
            <h2 class="text-lg font-bold text-gray-800 mb-3 border-b pb-2">Input Data Servis</h2>
            <form id="formServis" onsubmit="simpanData(event)" class="space-y-3">
                <input type="hidden" id="editId" value="">
                
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Tanggal</label>
                        <input type="date" id="tgl" required class="w-full p-2 border rounded text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Nama Pelanggan</label>
                        <input type="text" id="nama" placeholder="Contoh: Devi" required class="w-full p-2 border rounded text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">No. HP / WA</label>
                        <input type="text" id="nohp" placeholder="08xxxxxxxxxx" class="w-full p-2 border rounded text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Merk Motor</label>
                        <input type="text" id="merk" placeholder="Uwinfly / Selis / dll" class="w-full p-2 border rounded text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Tipe / Model</label>
                        <input type="text" id="tipe" placeholder="D66i / Emax / dll" class="w-full p-2 border rounded text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Plat Nomor / KM</label>
                        <div class="grid grid-cols-2 gap-1">
                            <input type="text" id="plat" placeholder="Plat" class="p-2 border rounded text-sm focus:ring-2 focus:ring-emerald-500 outline-none uppercase">
                            <input type="number" id="kilometer" placeholder="KM" class="p-2 border rounded text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                        </div>
                    </div>
                </div>

                <!-- Rincian Pekerjaan & Biaya Dinamis -->
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Rincian Pekerjaan & Biaya</label>
                    <div id="wadahPekerjaan" class="space-y-2 mb-2">
                        <!-- Baris pekerjaan akan di-generate via JS -->
                    </div>
                    <button type="button" onclick="tambahBarisPekerjaan()" class="text-xs bg-gray-200 hover:bg-gray-300 text-gray-800 px-3 py-1.5 rounded font-medium transition">
                        + Tambah Pekerjaan / Part
                    </button>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Catatan Tambahan</label>
                    <textarea id="catatan" rows="2" placeholder="Catatan kondisi unit, garansi, dll." class="w-full p-2 border rounded text-sm focus:ring-2 focus:ring-emerald-500 outline-none"></textarea>
                </div>

                <div class="flex gap-2 pt-2">
                    <button type="submit" id="btnSimpan" class="flex-1 bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-2 px-4 rounded text-sm transition">
                        Simpan Data
                    </button>
                    <button type="button" onclick="resetForm()" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded text-sm transition">
                        Batal
                    </button>
                </div>
            </form>
        </div>

        <!-- Section Cari & Riwayat Servis -->
        <div class="bg-white rounded-lg shadow p-4 space-y-3">
            <h2 class="text-lg font-bold text-gray-800 border-b pb-2">Cari & Riwayat Servis</h2>
            
            <input type="text" id="inputCari" oninput="prosesFilterData()" placeholder="Cari nama, merk, tipe, plat, atau HP..." class="w-full p-2 border rounded text-sm focus:ring-2 focus:ring-emerald-500 outline-none">

            <!-- Tombol Pengurutan -->
            <div class="flex items-center gap-2 flex-wrap text-xs bg-gray-50 p-2 rounded border">
                <span class="font-semibold text-gray-600">📌 Urutkan Berdasarkan:</span>
                <button onclick="ubahUrutan('tgl')" id="btnUrut-tgl" class="btn-sortir aktif">Tanggal ⇅</button>
                <button onclick="ubahUrutan('nama')" id="btnUrut-nama" class="btn-sortir">Nama A-Z</button>
                <button onclick="ubahUrutan('merk')" id="btnUrut-merk" class="btn-sortir">Merk</button>
                <button onclick="ubahUrutan('tipe')" id="btnUrut-tipe" class="btn-sortir">Tipe</button>
                <button onclick="ubahUrutan('total')" id="btnUrut-total" class="btn-sortir">Biaya ⇅</button>
            </div>

            <!-- Tabel Riwayat -->
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs sm:text-sm">
                    <thead>
                        <tr class="bg-gray-100 border-b text-gray-700 font-bold">
                            <th class="p-2">Tgl</th>
                            <th class="p-2">Pelanggan</th>
                            <th class="p-2">Motor</th>
                            <th class="p-2">Plat / KM</th>
                            <th class="p-2 text-right">Total</th>
                            <th class="p-2 text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tabelRiwayat">
                        <!-- Data riwayat dirender via JS -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Modal Struk Cetak / Preview -->
    <div id="modalStruk">
        <div class="isi-modal">
            <div id="areaCetak">
                <!-- Struk di-generate otomatis via JavaScript -->
            </div>
            
            <div class="mt-4 flex flex-col gap-2 no-print">
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="window.print()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded text-xs transition">
                        🖨️ Cetak
                    </button>
                    <button onclick="kirimWA()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded text-xs transition">
                        📲 Kirim WA
                    </button>
                </div>
                <button onclick="tutupStruk()" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 rounded text-xs transition">
                    ✖ Tutup
                </button>
            </div>
        </div>
    </div>

    <script>
        // Key LocalStorage
        const LOCAL_STORAGE_KEY = 'MFEV_SERVICE_DATA';

        let dataServis = [];
        let urutField = 'tgl';
        let urutArah = 'desc';
        let dataTerpilih = null;

        // Inisialisasi saat halaman dimuat
        document.addEventListener('DOMContentLoaded', () => {
            const hariIni = new Date().toISOString().split('T')[0];
            document.getElementById('tgl').value = hariIni;
            
            muatData();
            if (dataServis.length === 0) {
                tambahBarisPekerjaan();
            }
        });

        // Ambil Data dari LocalStorage
        function ambilData() {
            const simpanan = localStorage.getItem(LOCAL_STORAGE_KEY);
            return simpanan ? JSON.parse(simpanan) : [];
        }

        // Simpan Data ke LocalStorage
        function simpanKeStorage(data) {
            localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(data));
        }

        function muatData() {
            dataServis = ambilData();
            prosesFilterData();
        }

        // Tambah Baris Input Pekerjaan
        function tambahBarisPekerjaan(nama = '', biaya = '') {
            const wadah = document.getElementById('wadahPekerjaan');
            const div = document.createElement('div');
            div.className = 'flex gap-2 items-center baris-input-pekerjaan';
            div.innerHTML = `
                <input type="text" placeholder="Nama Pekerjaan / Sparepart" value="${nama}" required class="input-kerja p-2 border rounded text-xs focus:ring-1 focus:ring-emerald-500 outline-none">
                <input type="number" placeholder="Biaya (Rp)" value="${biaya}" required class="input-biaya w-32 p-2 border rounded text-xs focus:ring-1 focus:ring-emerald-500 outline-none">
                <button type="button" onclick="hapusBarisPekerjaan(this)" class="bg-red-500 hover:bg-red-600 text-white text-xs px-2 py-1.5 rounded">✕</button>
            `;
            wadah.appendChild(div);
        }

        function hapusBarisPekerjaan(btn) {
            const wadah = document.getElementById('wadahPekerjaan');
            if (wadah.children.length > 1) {
                btn.closest('.baris-input-pekerjaan').remove();
            } else {
                alert("Minimal harus ada 1 jenis pekerjaan/part.");
            }
        }

        // Simpan Data Servis
        function simpanData(e) {
            e.preventDefault();
            
            const editId = document.getElementById('editId').value;
            const tgl = document.getElementById('tgl').value;
            const nama = document.getElementById('nama').value.trim();
            const nohp = document.getElementById('nohp').value.trim();
            const merk = document.getElementById('merk').value.trim();
            const tipe = document.getElementById('tipe').value.trim();
            const plat = document.getElementById('plat').value.trim();
            const kilometer = document.getElementById('kilometer').value.trim();
            const catatan = document.getElementById('catatan').value.trim();

            const barisPekerjaan = document.querySelectorAll('.baris-input-pekerjaan');
            let daftarPekerjaan = [];
            let totalBiaya = 0;

            barisPekerjaan.forEach(b => {
                const namaKerja = b.querySelector('.input-kerja').value.trim();
                const biayaKerja = parseFloat(b.querySelector('.input-biaya').value) || 0;
                if(namaKerja) {
                    daftarPekerjaan.push({ nama: namaKerja, biaya: biayaKerja });
                    totalBiaya += biayaKerja;
                }
            });

            let dataSimpan = ambilData();

            if (editId) {
                // Update Data
                const index = dataSimpan.findIndex(x => x.id == editId);
                if (index !== -1) {
                    dataSimpan[index] = {
                        id: editId,
                        tgl, nama, nohp, merk, tipe, plat, kilometer, catatan,
                        daftarPekerjaan, total: totalBiaya
                    };
                }
            } else {
                // Tambah Data Baru
                const idBaru = Date.now().toString();
                dataSimpan.push({
                    id: idBaru,
                    tgl, nama, nohp, merk, tipe, plat, kilometer, catatan,
                    daftarPekerjaan, total: totalBiaya
                });
            }

            simpanKeStorage(dataSimpan);
            resetForm();
            muatData();
            
            document.getElementById('statusProses').textContent = 'Data Berhasil Disimpan!';
            setTimeout(() => { document.getElementById('statusProses').textContent = 'Siap'; }, 2500);
        }

        // Edit Data
        function editData(id) {
            const data = ambilData().find(x => x.id == id);
            if (!data) return;

            document.getElementById('editId').value = data.id;
            document.getElementById('tgl').value = data.tgl;
            document.getElementById('nama').value = data.nama;
            document.getElementById('nohp').value = data.nohp || '';
            document.getElementById('merk').value = data.merk || '';
            document.getElementById('tipe').value = data.tipe || '';
            document.getElementById('plat').value = data.plat || '';
            document.getElementById('kilometer').value = data.kilometer || '';
            document.getElementById('catatan').value = data.catatan || '';

            const wadah = document.getElementById('wadahPekerjaan');
            wadah.innerHTML = '';
            
            if (data.daftarPekerjaan && data.daftarPekerjaan.length > 0) {
                data.daftarPekerjaan.forEach(p => tambahBarisPekerjaan(p.nama, p.biaya));
            } else {
                tambahBarisPekerjaan();
            }

            document.getElementById('btnSimpan').textContent = 'Update Data Servis';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Hapus Data
        function hapusData(id) {
            if (confirm("Apakah Anda yakin ingin menghapus data servis ini?")) {
                let data = ambilData();
                data = data.filter(x => x.id != id);
                simpanKeStorage(data);
                muatData();
            }
        }

        // Reset Form
        function resetForm() {
            document.getElementById('formServis').reset();
            document.getElementById('editId').value = '';
            document.getElementById('wadahPekerjaan').innerHTML = '';
            tambahBarisPekerjaan();
            
            const hariIni = new Date().toISOString().split('T')[0];
            document.getElementById('tgl').value = hariIni;
            document.getElementById('btnSimpan').textContent = 'Simpan Data';
        }

        // Tampilkan Data ke Tabel
        function tampilkanTabel(daftar) {
            const tbody = document.getElementById('tabelRiwayat');
            tbody.innerHTML = '';

            if (daftar.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-gray-500">Belum ada data servis recorded.</td></tr>`;
                return;
            }

            daftar.forEach(i => {
                const tr = document.createElement('tr');
                tr.className = 'border-b hover:bg-gray-50 transition';

                const motorInfo = [i.merk, i.tipe].filter(Boolean).join(' ') || '-';
                const platKmInfo = [i.plat ? i.plat.toUpperCase() : null, i.kilometer ? i.kilometer + ' KM' : null].filter(Boolean).join(' / ') || '-';

                tr.innerHTML = `
                    <td class="p-2 whitespace-nowrap">${ubahFormatTanggal(i.tgl)}</td>
                    <td class="p-2">
                        <div class="font-bold text-gray-800">${i.nama}</div>
                        <div class="text-xs text-gray-500">${i.nohp || '-'}</div>
                    </td>
                    <td class="p-2">${motorInfo}</td>
                    <td class="p-2">${platKmInfo}</td>
                    <td class="p-2 text-right font-bold text-emerald-700">Rp ${(i.total || 0).toLocaleString('id-ID')}</td>
                    <td class="p-2 text-center">
                        <div class="flex justify-center gap-1">
                            <button onclick="bukaStruk('${i.id}')" class="bg-blue-600 hover:bg-blue-700 text-white px-2 py-1 rounded text-xs font-semibold">Struk</button>
                            <button onclick="editData('${i.id}')" class="bg-amber-500 hover:bg-amber-600 text-white px-2 py-1 rounded text-xs font-semibold">Edit</button>
                            <button onclick="hapusData('${i.id}')" class="bg-red-600 hover:bg-red-700 text-white px-2 py-1 rounded text-xs font-semibold">Hapus</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Pengurutan & Pencarian Data
        function prosesFilterData() {
            let data = ambilData();
            const kataKunci = document.getElementById('inputCari').value.toLowerCase();

            if (kataKunci) {
                data = data.filter(i => 
                    (i.nama && i.nama.toLowerCase().includes(kataKunci)) ||
                    (i.merk && i.merk.toLowerCase().includes(kataKunci)) ||
                    (i.tipe && i.tipe.toLowerCase().includes(kataKunci)) ||
                    (i.plat && i.plat.toLowerCase().includes(kataKunci)) ||
                    (i.nohp && i.nohp.toLowerCase().includes(kataKunci))
                );
            }

            data.sort((a, b) => {
                let valA = a[urutField] || '';
                let valB = b[urutField] || '';

                if (typeof valA === 'string') valA = valA.toLowerCase();
                if (typeof valB === 'string') valB = valB.toLowerCase();

                if (valA < valB) return urutArah === 'asc' ? -1 : 1;
                if (valA > valB) return urutArah === 'asc' ? 1 : -1;
                return 0;
            });

            tampilkanTabel(data);
        }

        function ubahUrutan(field) {
            if (urutField === field) {
                urutArah = urutArah === 'asc' ? 'desc' : 'asc';
            } else {
                urutField = field;
                urutArah = 'asc';
            }

            document.querySelectorAll('.btn-sortir').forEach(b => b.classList.remove('aktif'));
            const btnAktif = document.getElementById(`btnUrut-${field}`);
            if (btnAktif) btnAktif.classList.add('aktif');

            prosesFilterData();
        }

        // Fungsi Buka Struk (Perbaikan Layout CSS Lebar & Pemotongan Harga)
        function bukaStruk(id) { 
            dataTerpilih = ambilData().find(x => x.id == id); 
            if(!dataTerpilih) return;
            
            let r = '';
            if (dataTerpilih.daftarPekerjaan && Array.isArray(dataTerpilih.daftarPekerjaan)) {
                dataTerpilih.daftarPekerjaan.forEach(p => {
                    if(p.nama) {
                        r += `
                        <div class="baris">
                            <span class="item-nama">${p.nama}</span>
                            <span class="item-harga">Rp ${(p.biaya || 0).toLocaleString('id-ID')}</span>
                        </div>`;
                    }
                });
            }

            document.getElementById('areaCetak').innerHTML = `
                <div class="struk">
                    <div class="judul-toko">MF.EV SERVICE</div>
                    <div class="sub-judul">Pangkalpinang, Bangka Belitung</div>
                    <div class="garis"></div>
                    <div class="baris-struk"><span class="label-struk">Tanggal</span><span>: ${ubahFormatTanggal(dataTerpilih.tgl)}</span></div>
                    <div class="baris-struk"><span class="label-struk">Pelanggan</span><span>: ${dataTerpilih.nama}</span></div>
                    <div class="baris-struk"><span class="label-struk">No HP</span><span>: ${dataTerpilih.nohp || '-'}</span></div>
                    <div class="baris-struk"><span class="label-struk">Merk / Tipe</span><span>: ${dataTerpilih.merk||'-'} ${dataTerpilih.tipe||''}</span></div>
                    <div class="baris-struk"><span class="label-struk">No Plat</span><span>: ${dataTerpilih.plat ? dataTerpilih.plat.toUpperCase() : '-'}</span></div>
                    <div class="baris-struk"><span class="label-struk">KM Motor</span><span>: ${dataTerpilih.kilometer ? dataTerpilih.kilometer+' KM' : '-'}</span></div>
                    <div class="garis"></div>
                    <div class="tebal" style="margin-bottom: 3px;">RINCIAN PEKERJAAN:</div>
                    ${r}
                    <div class="garis"></div>
                    <div class="baris tebal" style="font-size:11px; margin-top: 4px;">
                        <span>TOTAL BIAYA</span>
                        <span class="item-harga">Rp ${(dataTerpilih.total || 0).toLocaleString('id-ID')}</span>
                    </div>
                    <div class="garis"></div>
                    ${dataTerpilih.catatan ? `<div class="tebal">CATATAN:</div><div>${dataTerpilih.catatan}</div><div class="garis"></div>` : ''}
                    <div class="tengah" style="margin-top: 6px;">Terima Kasih</div>
                    <div class="tengah">Semoga Motor Anda Awet :-)</div>
                </div>
            `;
            document.getElementById('modalStruk').style.display = 'block'; 
        }

        function tutupStruk() {
            document.getElementById('modalStruk').style.display = 'none';
        }

        function kirimWA() {
            if (!dataTerpilih) return;
            
            let hp = String(dataTerpilih.nohp || '').replace(/\D/g, '');
            if (!hp) {
                alert("Nomor HP pelanggan belum diisi.");
                return;
            }
            if (hp.startsWith('0')) hp = '62' + hp.slice(1);

            let rincianPekerjaan = '';
            if (dataTerpilih.daftarPekerjaan) {
                dataTerpilih.daftarPekerjaan.forEach((p, index) => {
                    rincianPekerjaan += `\n${index + 1}. ${p.nama} - Rp ${(p.biaya || 0).toLocaleString('id-ID')}`;
                });
            }

            const pesan = `*STRUK SERVICE - MF.EV SERVICE*
Pangkalpinang, Bangka Belitung
-------------------------------------
*Tanggal*: ${ubahFormatTanggal(dataTerpilih.tgl)}

        // Helper Format Tanggal Indonesia (DD-MM-YYYY)
        function ubahFormatTanggal(tglStr) {
            if (!tglStr) return '-';
            const p = tglStr.split('-');
            if (p.length === 3) return `${p[2]}-${p[1]}-${p[0]}`;
            return tglStr;
